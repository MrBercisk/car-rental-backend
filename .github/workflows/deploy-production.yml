name: Deploy Backend ke Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Validasi Composer
        run: composer validate --no-check-all

      # Jagoan Hosting blokir eval() (DISEVAL) sehingga composer TIDAK BISA
      # dijalankan langsung di server. Solusinya: build vendor/ di runner ini,
      # lalu kirim hasilnya ke server via SCP.
      - name: Composer install (di runner, bukan di server)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Sync kode + vendor ke server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 45022
          source: "."
          target: "~/public_html/car-rental-backend"
          rm: false
          overwrite: true

      - name: Jalankan migrate & cache di server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 45022
          envs: APP_URL,DB_HOST,DB_DATABASE,DB_USERNAME,DB_PASSWORD,DB_PORT
          script: |
            set -e

            cd ~/public_html/car-rental-backend

            if [ ! -f .env ]; then
              cat > .env <<EOF
            APP_NAME="Rental Panel"
            APP_ENV=production
            APP_DEBUG=false
            APP_URL=${APP_URL}

            DB_CONNECTION=mysql
            DB_HOST=${DB_HOST}
            DB_PORT=${DB_PORT}
            DB_DATABASE=${DB_DATABASE}
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}

            SESSION_DRIVER=database
            CACHE_STORE=database
            QUEUE_CONNECTION=database
            EOF
              echo ".env berhasil dibuat, jangan lupa lengkapi variabel lain manual (MAIL_*, DOKU_*, dll)"
            else
              echo ".env sudah ada, tidak ditimpa"
            fi

            php artisan migrate --force

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link || true

            chmod -R 775 storage bootstrap/cache

            echo "===== DEPLOY BACKEND BERHASIL ====="
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
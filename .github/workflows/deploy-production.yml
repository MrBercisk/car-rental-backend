name: Deploy Backend ke Production

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql, bcmath, fileinfo
          coverage: none

      - name: Validasi Composer
        run: composer validate --no-check-all

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Composer install (dengan dev dependencies untuk testing)
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Siapkan environment testing
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tunggu MySQL siap
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root --silent && break
            echo "Menunggu MySQL... ($i)"
            sleep 2
          done

      - name: Jalankan Test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Validasi Composer
        run: composer validate --no-check-all

      # Jagoan Hosting blokir eval() (DISEVAL) sehingga composer TIDAK BISA
      # dijalankan langsung di server. Solusinya: build vendor/ di runner ini,
      # lalu kirim hasilnya ke server via SCP.
      - name: Composer install (di runner, bukan di server)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Sync kode + vendor ke server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 45022
          source: "."
          target: "~/public_html/car-rental-backend"
          rm: false
          overwrite: true

      - name: Jalankan migrate & cache di server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 45022
          envs: APP_URL,DB_HOST,DB_DATABASE,DB_USERNAME,DB_PASSWORD,DB_PORT
          script: |
            cd ~/public_html/car-rental-backend

            # Pastikan situs SELALU keluar dari mode maintenance apa pun
            # yang terjadi di bawah — walau migrate/step lain gagal.
            trap 'php artisan up || true' EXIT

            set -e

            if [ ! -f .env ]; then
              cat > .env <<EOF
            APP_NAME="Rental Panel"
            APP_ENV=production
            APP_DEBUG=false
            APP_URL=${APP_URL}

            DB_CONNECTION=mysql
            DB_HOST=${DB_HOST}
            DB_PORT=${DB_PORT}
            DB_DATABASE=${DB_DATABASE}
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}

            SESSION_DRIVER=database
            CACHE_STORE=database
            QUEUE_CONNECTION=database
            EOF
              echo ".env berhasil dibuat, jangan lupa lengkapi variabel lain manual (MAIL_*, DOKU_*, dll)"
            else
              echo ".env sudah ada, tidak ditimpa"
            fi

            php artisan down || true

            # Backup database sebelum migrate, dibaca dari .env yang benar-
            # benar dipakai server (bukan dari secrets), biar selalu sinkron
            # meski .env pernah diedit manual. Simpan maksimal 5 terakhir.
            mkdir -p storage/backups
            LIVE_DB_DATABASE=$(grep -m1 '^DB_DATABASE=' .env | cut -d '=' -f2)
            LIVE_DB_USERNAME=$(grep -m1 '^DB_USERNAME=' .env | cut -d '=' -f2)
            LIVE_DB_PASSWORD=$(grep -m1 '^DB_PASSWORD=' .env | cut -d '=' -f2)
            LIVE_DB_HOST=$(grep -m1 '^DB_HOST=' .env | cut -d '=' -f2)
            LIVE_DB_PORT=$(grep -m1 '^DB_PORT=' .env | cut -d '=' -f2)
            BACKUP_FILE="storage/backups/backup_$(date +%Y%m%d_%H%M%S).sql"
            mysqldump -h "$LIVE_DB_HOST" -P "$LIVE_DB_PORT" -u "$LIVE_DB_USERNAME" -p"$LIVE_DB_PASSWORD" "$LIVE_DB_DATABASE" > "$BACKUP_FILE" || echo "WARNING: backup gagal, lanjut deploy tanpa backup"
            ls -t storage/backups/backup_*.sql 2>/dev/null | tail -n +6 | xargs -r rm --

            php artisan migrate --force

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Server ini blokir symlink (storage:link menghasilkan 403),
            # jadi file public disimpan langsung di public/storage, bukan symlink.
            mkdir -p public/storage

            chmod -R 775 storage bootstrap/cache public/storage

            echo "===== DEPLOY BACKEND BERHASIL ====="
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
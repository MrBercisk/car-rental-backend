name: Deploy Backend ke Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Validasi Composer
        run: composer validate --no-check-all

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 45022
          envs: APP_URL,DB_HOST,DB_DATABASE,DB_USERNAME,DB_PASSWORD,DB_PORT
          script: |
            set -e

            cd ~/public_html/car-rental-backend

            git fetch origin
            git reset --hard origin/main

            if [ ! -f .env ]; then
              cat > .env <<EOF
            APP_NAME="Rental Panel"
            APP_ENV=production
            APP_DEBUG=false
            APP_URL=${APP_URL}

            DB_CONNECTION=mysql
            DB_HOST=${DB_HOST}
            DB_PORT=${DB_PORT}
            DB_DATABASE=${DB_DATABASE}
            DB_USERNAME=${DB_USERNAME}
            DB_PASSWORD=${DB_PASSWORD}

            SESSION_DRIVER=database
            CACHE_STORE=database
            QUEUE_CONNECTION=database
            EOF
              echo ".env berhasil dibuat, jangan lupa lengkapi variabel lain manual (MAIL_*, DOKU_*, dll)"
            else
              echo ".env sudah ada, tidak ditimpa"
            fi

            # Composer path Jagoan Hosting biasanya /opt/cpanel/composer/bin/composer
            # Cek dulu path composer di server kamu lewat: which composer
            composer install --no-dev --optimize-autoloader --no-interaction

            php artisan migrate --force

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link || true

            chmod -R 775 storage bootstrap/cache

            echo "===== DEPLOY BACKEND BERHASIL ====="
        env:
          APP_URL: ${{ secrets.APP_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}